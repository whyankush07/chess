services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  db:
    image: postgres:16   # adjust to your actual db package
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports: ["5432:5432"]

  backend:
    build: ./apps/server
    deploy:
      replicas: 1
    depends_on: [db]

  ws-server:
    build: ./apps/native
    deploy:
      replicas: 3
    depends_on: [redis]

  history-worker:
    build: ./apps/history-worker
    deploy:
      replicas: 2   # scale this separately mr.deshwal
    depends_on: [redis, db]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80", "8081:81"]
    depends_on: [backend, ws-server]