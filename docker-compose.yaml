services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports: ["5432:5432"]

  backend:
    build: ./apps/server
    deploy:
      replicas: 1
    depends_on: [db]

  ws-server:
    build: ./apps/native
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
    deploy:
      replicas: 3
    depends_on: [redis]

  ws-proxy:
    build: ./apps/ws-proxy
    environment:
      PORT: 8080
      BACKENDS: ws-server:8080
    ports: ["8080:8080"]
    depends_on: [ws-server]

  history-worker:
    build: ./apps/history-worker
    deploy:
      replicas: 2   # scale this separately mr.deshwal
    depends_on: [redis, db]